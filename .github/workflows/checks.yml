name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hupiao
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: hupiao_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hupiao -d hupiao_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hupiao:test-only-password@localhost:5432/hupiao_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest tests -q
        working-directory: backend
      - run: python -m ruff check app tests --select F
        working-directory: backend
      - run: node scripts/test-admin-ui.cjs
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck && npm run lint && npm run export:mobile
        working-directory: mobile

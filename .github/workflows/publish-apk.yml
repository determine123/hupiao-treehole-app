name: Publish verified Android APK
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing beta release tag, for example v1.0.1-beta.1
        required: true
        default: v1.0.1-beta.1
        type: string
      apk_url:
        description: Public EAS APK download URL
        required: true
        type: string
      sha256:
        description: Expected SHA-256 from the verified build
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-android-beta
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_URL: ${{ inputs.apk_url }}
      APK_SHA256: ${{ inputs.sha256 }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify APK
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || { echo 'Invalid beta release tag'; exit 1; }
          APK_NAME="hupiao-treehole-${RELEASE_TAG#v}.apk"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          case "$APK_URL" in https://expo.dev/artifacts/eas/*.apk) ;; *) echo 'Unexpected artifact host'; exit 1 ;; esac
          curl --fail --location --retry 3 "$APK_URL" --output "$APK_NAME"
          printf '%s  %s\n' "$APK_SHA256" "$APK_NAME" > "$APK_NAME.sha256"
          sha256sum --check "$APK_NAME.sha256"
          unzip -t "$APK_NAME" > /dev/null
      - name: Publish to beta release
        run: gh release upload "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --clobber

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沪漂树洞内容管理</title><style>body{max-width:850px;margin:35px auto;padding:20px;font:16px/1.7 system-ui;background:#122019;color:#e1eee5}input,button,textarea{font:inherit;padding:9px;border-radius:6px}section{border:1px solid #54715d;padding:18px;margin:15px 0;border-radius:10px}button{cursor:pointer}pre{white-space:pre-wrap}label{display:block}#message{color:#ffd6ac}</style><h1>沪漂树洞内容管理</h1><p>密钥只保存在当前页面内存中。逐条阅读后决定，反馈回复会显示在内测用户的应用里。</p><label>管理员密钥 <input id="key" type="password" autocomplete="off"></label><p><button onclick="load('queue')">待审核</button> <button onclick="load('reports')">举报</button> <button onclick="load('feedback')">内测反馈</button> <button onclick="document.querySelector('#key').value='';document.querySelector('#list').replaceChildren()">退出</button></p><p id="message" role="status"></p><main id="list"></main><script>
const el=s=>document.querySelector(s);async function api(path,method='GET',body){const response=await fetch('/admin/'+path,{method,headers:{'X-Admin-Token':el('#key').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await response.json();if(!response.ok)throw Error(typeof d.detail==='string'?d.detail:'操作失败');return d;}function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n;}async function load(kind){try{const rows=await api(kind);el('#list').replaceChildren();el('#message').textContent=rows.length+' 条记录';for(const r of rows){const card=node('section','');card.append(node('h3',r.title||r.kind||r.type),node('pre',r.body),node('small',r.id));if(r.reason)card.append(node('p','举报原因：'+r.reason));if(kind==='feedback'){card.append(node('p','设备：'+r.device+' / 版本：'+r.app_version));const response=node('textarea','');response.value=r.response;response.placeholder='回复测试者';card.append(response);const states=document.createElement('select');for(const state of ['new','reviewing','planned','resolved','declined']){const option=node('option',state);option.value=state;states.append(option);}states.value=r.status;card.append(states);const save=node('button','保存回复');save.onclick=async()=>{try{await api('feedback/'+r.id,'PUT',{response:response.value,status:states.value});el('#message').textContent='已保存';}catch(e){el('#message').textContent=e.message}};card.append(save);}else{for(const decision of kind==='queue'?['approve','hide']:['hide']){const b=node('button',decision==='approve'?'通过':'隐藏');b.onclick=async()=>{const note=prompt('处理依据（至少两个字）');if(!note||note.trim().length<2)return;try{await api('moderate','POST',{target_type:r.type,target_id:r.target_id||r.id,decision,note});await load(kind);}catch(e){el('#message').textContent=e.message}};card.append(b);}}if(kind==='reports'){const dismiss=node('button','关闭举报');dismiss.onclick=async()=>{try{await api('reports/'+r.id,'DELETE');await load(kind);}catch(e){el('#message').textContent=e.message}};card.append(dismiss);}el('#list').append(card);}}catch(e){el('#message').textContent=e.message}}
</script></html>

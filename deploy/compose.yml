services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hupiao
      POSTGRES_USER: hupiao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hupiao -d hupiao"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://hupiao:${POSTGRES_PASSWORD}@db:5432/hupiao
      REDIS_URL: redis://redis:6379/0
      TOKEN_PEPPER: ${TOKEN_PEPPER:?Set TOKEN_PEPPER}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?Set SUPPORT_EMAIL}
      PUBLIC_API_URL: https://${DOMAIN}
      MODERATE_BEFORE_PUBLISH: "true"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  api:
    build: ../backend
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddydata:/data", "caddyconfig:/config"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  pgdata:
  caddydata:
  caddyconfig:
